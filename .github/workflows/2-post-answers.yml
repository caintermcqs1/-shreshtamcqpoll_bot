{"name":"2. Post answers (2 PM)","on":{"schedule":[{"cron":"45 7 * * 1-6"},{"cron":"15 8 * * 1-6"},{"cron":"45 8 * * 1-6"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"mcq-bot","cancel-in-progress":false},"defaults":{"run":{"working-directory":"ca-inter-mcq-bot"}},"jobs":{"answers":{"runs-on":"ubuntu-latest","steps":[{"name":"Wait until 2:00 PM IST","if":"github.event_name == 'schedule'","working-directory":".","run":"python3 -c \"import datetime as d,time;z=d.timezone(d.timedelta(hours=5,minutes=30));n=d.datetime.now(z);t=n.replace(hour=14,minute=0,second=0,microsecond=0);w=max(0,(t-n).total_seconds());print('Waiting',int(w),'seconds');time.sleep(w)\""},{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Close polls and post answers","run":"python bot.py answers","env":{"BOT_TOKEN":"${{ secrets.BOT_TOKEN }}","CHAT_ID":"${{ secrets.CHAT_ID }}","TOPIC_ID":"${{ vars.TOPIC_ID }}"}},{"name":"Save progress","run":"git config user.name mcq-bot\ngit config user.email mcq-bot@users.noreply.github.com\ngit add state.json\ngit diff --cached --quiet || git commit -m \"Update progress\"\ngit push"}]}}}
