{"name": "1. Post daily MCQs (11 AM)", "on": {"schedule": [{"cron": "20 5 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "mcq-bot", "cancel-in-progress": false}, "defaults": {"run": {"working-directory": "ca-inter-mcq-bot"}}, "jobs": {"post": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Post mini-cases and polls", "run": "python bot.py post", "env": {"BOT_TOKEN": "${{ secrets.BOT_TOKEN }}", "CHAT_ID": "${{ secrets.CHAT_ID }}", "TOPIC_ID": "${{ vars.TOPIC_ID }}"}}, {"name": "Save progress", "run": "git config user.name mcq-bot\ngit config user.email mcq-bot@users.noreply.github.com\ngit add state.json\ngit diff --cached --quiet || git commit -m \"Update progress\"\ngit push"}]}}}
