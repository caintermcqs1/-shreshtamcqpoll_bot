{"name":"1. Post daily MCQs (11 AM)","on":{"schedule":[{"cron":"0 5 * * 1-6"},{"cron":"30 5 * * 1-6"},{"cron":"0 6 * * 1-6"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"mcq-bot","cancel-in-progress":false},"defaults":{"run":{"working-directory":"ca-inter-mcq-bot"}},"jobs":{"post":{"runs-on":"ubuntu-latest","steps":[{"name":"Wait until 11:00 AM IST","if":"github.event_name == 'schedule'","working-directory":".","run":"python3 -c \"import datetime as d,time;z=d.timezone(d.timedelta(hours=5,minutes=30));n=d.datetime.now(z);t=n.replace(hour=11,minute=0,second=0,microsecond=0);w=max(0,(t-n).total_seconds());print('Waiting',int(w),'seconds');time.sleep(w)\""},{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Post mini-cases and polls","run":"python bot.py post","env":{"BOT_TOKEN":"${{ secrets.BOT_TOKEN }}","CHAT_ID":"${{ secrets.CHAT_ID }}","TOPIC_ID":"${{ vars.TOPIC_ID }}"}},{"name":"Save progress","run":"git config user.name mcq-bot\ngit config user.email mcq-bot@users.noreply.github.com\ngit add state.json\ngit diff --cached --quiet || git commit -m \"Update progress\"\ngit push"}]}}}
