name: "8. Test – send next MCQ day + announcement to test group (manual)"

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ca-inter-mcq-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send preview to the MCQs test group (nothing is saved)
        run: python bot.py test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TEST_CHAT: "-1004340727881"
