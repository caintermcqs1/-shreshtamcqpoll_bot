name: "19. CA Inter – Concept of the Day (9 AM)"

on:
  schedule:
    - cron: "0 2 * * 1-6"     # 7:30 AM IST – starts early, waits until 9:00 AM
    - cron: "20 2 * * 1-6"    # backup
    - cron: "40 2 * * 1-6"    # backup
    - cron: "0 3 * * 1-6"     # backup
  workflow_dispatch:
    inputs:
      date:
        description: "Post now for this date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ca-concept
  cancel-in-progress: false

defaults:
  run:
    working-directory: ca-inter-mcq-bot

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until shortly before 9:00 AM IST (scheduled runs only)
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          python3 -c "
          import datetime as d,time
          z=d.timezone(d.timedelta(hours=5,minutes=30)); n=d.datetime.now(z)
          t=n.replace(hour=8,minute=58,second=0,microsecond=0)
          w=max(0,(t-n).total_seconds()); print('Waiting',int(w),'seconds'); time.sleep(w)"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post Concept of the Day
        run: python concept.py post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WAIT: ${{ github.event_name == 'schedule' && '1' || '0' }}
          DATE: ${{ inputs.date }}
      - name: Save progress
        if: always()
        run: |
          git config user.name mcq-bot
          git config user.email mcq-bot@users.noreply.github.com
          [ -f concept_state.json ] || exit 0
          git add concept_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Concept of the Day progress"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
